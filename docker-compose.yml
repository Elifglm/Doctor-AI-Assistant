services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8700:8700"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - ASR_WHISPER__DEVICE=cpu
      - ASR_WHISPER__COMPUTE_TYPE=int8
    restart: unless-stopped

  mysql:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: openemr
      MYSQL_USER: openemr
      MYSQL_PASSWORD: openemr
    volumes:
      - openemr_mysql:/var/lib/mysql
    restart: unless-stopped

  openemr:
    image: openemr/openemr:7.0.2
    ports:
      - "8300:80"
      - "9300:443"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      MYSQL_DATABASE: openemr
      OE_USER: admin
      OE_PASS: pass
    volumes:
      - openemr_data:/var/www/localhost/htdocs/openemr/sites
    depends_on:
      - mysql
    restart: unless-stopped

  openemr-init:
    image: mariadb:10.11
    volumes:
      - ./docker/openemr/icd10_tr.sql:/tmp/icd10_tr.sql
      - ./docker/openemr/init_icd10.sh:/tmp/init_icd10.sh
    entrypoint: ["/bin/bash", "/tmp/init_icd10.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      MYSQL_DATABASE: openemr
    depends_on:
      - openemr
    restart: "no"

volumes:
  openemr_mysql:
  openemr_data:
